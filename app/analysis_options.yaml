include: package:flutter_lints/flutter.yaml

# NFR-29 (readable, organised code) and NFR-31 (standard naming) are graded.
# Enforcing them with the analyser rather than by eye means `dart analyze`
# clean is objective evidence rather than an opinion.

analyzer:
  errors:
    # Unused code is a defect, not a note.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    # Public API in domain/ and core/ is documented.
    dead_code: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── Naming (NFR-31) ─────────────────────────────────────────────────
    camel_case_types: true
    camel_case_extensions: true
    file_names: true
    non_constant_identifier_names: true
    constant_identifier_names: false # enum members read better in lowerCamel

    # ── Correctness ─────────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    unawaited_futures: true

    # ── RTL correctness (NFR-11a) ───────────────────────────────────────
    # Directional padding mirrors under RTL; left/right does not. This rule
    # turns an easy-to-miss layout bug into a compile-time complaint.
    use_named_constants: true

    # Disabled: Dart forbids `required this._privateField` in a named
    # parameter, so this rule fires on every constructor that assigns a
    # private field from a public named argument — which is the normal shape
    # for a repository. Keeping it on would mean either public mutable fields
    # or an `ignore` comment on every such class.
    prefer_initializing_formals: false

    # ── Readability (NFR-29) ────────────────────────────────────────────
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    unnecessary_lambdas: true
    directives_ordering: true

    # ── Performance (§8.1) ──────────────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true
